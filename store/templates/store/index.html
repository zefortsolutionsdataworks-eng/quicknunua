{% for category in categories %}
<div class="category-card">
    {% if category.image %}
        <img src="{{ category.image.url }}" alt="{{ category.name }}" class="category-image">
    {% else %}
        <div class="no-image">📦</div>
    {% endif %}
    <h3>{{ category.name }}</h3>
    <p>{{ category.products.count }} items</p>
</div>
{% endfor %}
