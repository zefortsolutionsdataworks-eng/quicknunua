services:
  - type: web
    name: quicknunua
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn quicknunua.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_HOSTS
        value: "quicknunua.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://quicknunua.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: quicknunua-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: quicknunua-db
    plan: free
    region: oregon